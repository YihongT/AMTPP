name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-24.04
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-tested.txt
          python -m pip install -e .
      - name: Check model and protocol
        run: python -m unittest discover -s tests -v
      - name: Check training and evaluation
        run: |
          python scripts/make_example.py
          amtpp-run --config configs/example.json --data data/example.pkl --output outputs/example
          amtpp-run --config configs/example.json --data data/example.pkl --output outputs/example --evaluate
